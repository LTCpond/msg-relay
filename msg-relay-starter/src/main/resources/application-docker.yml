# Docker环境配置 - 应用也跑在Docker中时使用
# 使用方式: java -jar app.jar --spring.profiles.active=docker

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/msg_relay?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
  data:
    redis:
      host: redis
  elasticsearch:
    uris: http://elasticsearch:9200

rocketmq:
  name-server: rocketmq-namesrv:9876

msg-relay:
  netty:
    node-id: ${NODE_ID:node-1}
  snowflake:
    worker-id: ${SNOWFLAKE_WORKER_ID:1}
    datacenter-id: ${SNOWFLAKE_DATACENTER_ID:1}
