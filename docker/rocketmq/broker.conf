# RocketMQ Broker Configuration
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# NameServer address (use container name in docker network)
namesrvAddr = rocketmq-namesrv:9876

# Let RocketMQ auto-detect the IP (Docker bridge IP, reachable from host and containers)
# brokerIP1 is intentionally left unset for Docker Compose compatibility

# Auto-create topic
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
